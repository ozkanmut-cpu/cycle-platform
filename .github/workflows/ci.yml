name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-and-build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Root dependencies
        run: flutter pub get

      - name: Patient dependencies
        run: flutter pub get
        working-directory: apps/patient

      - name: Partner dependencies
        run: flutter pub get
        working-directory: apps/partner

      - name: Doctor dependencies
        run: flutter pub get
        working-directory: apps/doctor

      - name: Core domain dependencies
        run: dart pub get
        working-directory: packages/core_domain

      - name: Intelligence dependencies
        run: dart pub get
        working-directory: packages/intelligence

      - name: Clinical document dependencies
        run: dart pub get
        working-directory: packages/clinical_documents

      - name: Clinical copilot dependencies
        run: dart pub get
        working-directory: packages/clinical_copilot

      - name: Sharing dependencies
        run: dart pub get
        working-directory: packages/sharing

      - name: Crypto dependencies
        run: dart pub get
        working-directory: packages/crypto

      - name: Storage dependencies
        run: dart pub get
        working-directory: packages/storage

      - name: Backup dependencies
        run: dart pub get
        working-directory: packages/backup

      - name: Security dependencies
        run: dart pub get
        working-directory: packages/security

      - name: Permission dependencies
        run: dart pub get
        working-directory: packages/permissions

      - name: Health ingestion dependencies
        run: dart pub get
        working-directory: packages/health_ingestion

      - name: Secure key store dependencies
        run: flutter pub get
        working-directory: packages/secure_key_store

      - name: SQLCipher storage dependencies
        run: flutter pub get
        working-directory: packages/storage_sqlcipher

      - name: Encrypted file vault dependencies
        run: dart pub get
        working-directory: packages/storage_file_vault

      - name: Format check
        run: |
          dart format packages apps
          git diff --exit-code

      - name: Analyze core domain
        run: dart analyze .
        working-directory: packages/core_domain

      - name: Analyze intelligence
        run: dart analyze .
        working-directory: packages/intelligence

      - name: Analyze clinical documents
        run: dart analyze .
        working-directory: packages/clinical_documents

      - name: Analyze clinical copilot
        run: dart analyze .
        working-directory: packages/clinical_copilot

      - name: Analyze sharing
        run: dart analyze .
        working-directory: packages/sharing

      - name: Analyze crypto
        run: dart analyze .
        working-directory: packages/crypto

      - name: Analyze storage
        run: dart analyze .
        working-directory: packages/storage

      - name: Analyze backup
        run: dart analyze .
        working-directory: packages/backup

      - name: Analyze security
        run: dart analyze .
        working-directory: packages/security

      - name: Analyze permissions
        run: dart analyze .
        working-directory: packages/permissions

      - name: Analyze health ingestion
        run: dart analyze .
        working-directory: packages/health_ingestion

      - name: Analyze secure key store
        run: flutter analyze
        working-directory: packages/secure_key_store

      - name: Analyze SQLCipher storage
        run: flutter analyze
        working-directory: packages/storage_sqlcipher

      - name: Analyze encrypted file vault
        run: dart analyze .
        working-directory: packages/storage_file_vault

      - name: Analyze Patient
        run: flutter analyze
        working-directory: apps/patient

      - name: Analyze Partner
        run: flutter analyze
        working-directory: apps/partner

      - name: Analyze Doctor
        run: flutter analyze
        working-directory: apps/doctor

      - name: Test core domain
        run: dart test
        working-directory: packages/core_domain

      - name: Test intelligence
        run: dart test
        working-directory: packages/intelligence

      - name: Test clinical documents
        run: dart test
        working-directory: packages/clinical_documents

      - name: Test clinical copilot
        run: dart test
        working-directory: packages/clinical_copilot

      - name: Test sharing
        run: dart test
        working-directory: packages/sharing

      - name: Test crypto
        run: dart test
        working-directory: packages/crypto

      - name: Test storage
        run: dart test
        working-directory: packages/storage

      - name: Test backup
        run: dart test
        working-directory: packages/backup

      - name: Test security
        run: dart test
        working-directory: packages/security

      - name: Test permissions
        run: dart test
        working-directory: packages/permissions

      - name: Test health ingestion
        run: dart test
        working-directory: packages/health_ingestion

      - name: Test secure key store
        run: flutter test
        working-directory: packages/secure_key_store

      - name: Test SQLCipher storage
        run: flutter test
        working-directory: packages/storage_sqlcipher

      - name: Test encrypted file vault
        run: dart test
        working-directory: packages/storage_file_vault

      - name: Test Patient
        run: flutter test
        working-directory: apps/patient

      - name: Test Partner
        run: flutter test
        working-directory: apps/partner

      - name: Test Doctor
        run: flutter test
        working-directory: apps/doctor

      - name: Test Patient HealthKit signing verifier
        run: python3 -m unittest tool/test_verify_patient_healthkit_signing.py

      - name: Bootstrap native Patient shell
        run: bash tool/bootstrap_patient_native.sh

      - name: Configure Patient HealthKit bridge
        run: |
          python3 ../../tool/configure_patient_healthkit.py
          python3 ../../tool/patch_patient_healthkit_read_scope.py
        working-directory: apps/patient

      - name: Verify Patient HealthKit signing contract
        run: python3 ../../tool/verify_patient_healthkit_signing.py --app-dir .
        working-directory: apps/patient

      - name: Enforce Patient Android minimum SDK
        run: bash tool/ensure_patient_android_sdk.sh

      - name: Verify native Patient security
        run: bash tool/verify_patient_native_security.sh

      - name: Resolve Patient dependencies after native bootstrap
        run: flutter pub get
        working-directory: apps/patient

      - name: Build Patient debug APK
        run: flutter build apk --debug
        working-directory: apps/patient

      - name: Upload Patient debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cycle-patient-debug-apk
          path: apps/patient/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  patient-ios-native:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Patient dependencies
        run: flutter pub get
        working-directory: apps/patient

      - name: Bootstrap native Patient shell
        run: bash tool/bootstrap_patient_native.sh

      - name: Configure Patient HealthKit bridge
        run: |
          python3 ../../tool/configure_patient_healthkit.py
          python3 ../../tool/patch_patient_healthkit_read_scope.py
        working-directory: apps/patient

      - name: Verify Patient HealthKit signing contract
        run: python3 ../../tool/verify_patient_healthkit_signing.py --app-dir .
        working-directory: apps/patient

      - name: Verify native Patient security
        run: bash tool/verify_patient_native_security.sh

      - name: Resolve Patient dependencies after native bootstrap
        run: flutter pub get
        working-directory: apps/patient

      - name: Compile Patient iOS native integration
        run: flutter build ios --config-only --no-codesign --debug
        working-directory: apps/patient
