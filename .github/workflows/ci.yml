name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Root dependencies
        run: flutter pub get

      - name: Patient dependencies
        run: flutter pub get
        working-directory: apps/patient

      - name: Partner dependencies
        run: flutter pub get
        working-directory: apps/partner

      - name: Doctor dependencies
        run: flutter pub get
        working-directory: apps/doctor

      - name: Core domain dependencies
        run: dart pub get
        working-directory: packages/core_domain

      - name: Crypto dependencies
        run: dart pub get
        working-directory: packages/crypto

      - name: Storage dependencies
        run: dart pub get
        working-directory: packages/storage

      - name: Secure key store dependencies
        run: flutter pub get
        working-directory: packages/secure_key_store

      - name: SQLCipher storage dependencies
        run: flutter pub get
        working-directory: packages/storage_sqlcipher

      - name: Encrypted file vault dependencies
        run: dart pub get
        working-directory: packages/storage_file_vault

      - name: Format check
        run: |
          dart format packages apps
          git diff --exit-code

      - name: Analyze core domain
        run: dart analyze .
        working-directory: packages/core_domain

      - name: Analyze crypto
        run: dart analyze .
        working-directory: packages/crypto

      - name: Analyze storage
        run: dart analyze .
        working-directory: packages/storage

      - name: Analyze secure key store
        run: flutter analyze
        working-directory: packages/secure_key_store

      - name: Analyze SQLCipher storage
        run: flutter analyze
        working-directory: packages/storage_sqlcipher

      - name: Analyze encrypted file vault
        run: dart analyze .
        working-directory: packages/storage_file_vault

      - name: Analyze Patient
        run: flutter analyze
        working-directory: apps/patient

      - name: Analyze Partner
        run: flutter analyze
        working-directory: apps/partner

      - name: Analyze Doctor
        run: flutter analyze
        working-directory: apps/doctor

      - name: Test core domain
        run: dart test
        working-directory: packages/core_domain

      - name: Test crypto
        run: dart test
        working-directory: packages/crypto

      - name: Test encrypted file vault
        run: dart test
        working-directory: packages/storage_file_vault

  patient-android-build:
    needs: analyze-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap native Patient shell
        run: bash tool/bootstrap_patient_native.sh

      - name: Resolve Patient dependencies
        run: flutter pub get
        working-directory: apps/patient

      - name: Build Patient debug APK
        run: flutter build apk --debug
        working-directory: apps/patient
