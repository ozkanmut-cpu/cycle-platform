name: Fertility Domain

on:
  push:
    paths:
      - 'packages/fertility_domain/**'
      - '.github/workflows/fertility-domain.yml'
  pull_request:
    paths:
      - 'packages/fertility_domain/**'
      - '.github/workflows/fertility-domain.yml'

jobs:
  verify:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: packages/fertility_domain
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Dependencies
        run: dart pub get
      - name: Format diagnostic
        run: |
          dart format .
          git diff -- .
          git diff --exit-code -- .
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Test
        run: dart test
