name: Simulation Lab

on:
  pull_request:
    paths:
      - 'packages/simulation_domain/**'
      - 'docs/SIMULATION_LAB.md'
      - 'docs/SIMULATION_PERSONAS.md'
      - 'docs/SIMULATION_COHORT.md'
      - 'docs/SIMULATION_HEALTH_WORLD.md'
      - 'docs/SIMULATION_LONGITUDINAL.md'
      - 'docs/SIMULATION_GROUND_TRUTH_ORACLE.md'
      - 'docs/SIMULATION_HARD_SAFETY.md'
      - 'docs/SIMULATION_PERMISSION_FLOW.md'
      - 'docs/SIMULATION_RELATIONSHIP_BEHAVIOR.md'
      - 'docs/SIMULATION_PRIVACY_ATTACK.md'
      - 'apps/patient/**'
      - 'docs/SIMULATION_PATIENT_JOURNEY.md'
      - 'docs/superpowers/specs/2026-09-17-patient-journey-lab-design.md'
      - 'docs/superpowers/plans/2026-09-17-patient-journey-lab.md'
      - '.github/workflows/simulation-lab.yml'
  push:
    branches: [main]
    paths:
      - 'packages/simulation_domain/**'
      - 'docs/SIMULATION_LAB.md'
      - 'docs/SIMULATION_PERSONAS.md'
      - 'docs/SIMULATION_COHORT.md'
      - 'docs/SIMULATION_HEALTH_WORLD.md'
      - 'docs/SIMULATION_LONGITUDINAL.md'
      - 'docs/SIMULATION_GROUND_TRUTH_ORACLE.md'
      - 'docs/SIMULATION_HARD_SAFETY.md'
      - 'docs/SIMULATION_PERMISSION_FLOW.md'
      - 'docs/SIMULATION_RELATIONSHIP_BEHAVIOR.md'
      - 'docs/SIMULATION_PRIVACY_ATTACK.md'
      - 'apps/patient/**'
      - 'docs/SIMULATION_PATIENT_JOURNEY.md'
      - 'docs/superpowers/specs/2026-09-17-patient-journey-lab-design.md'
      - 'docs/superpowers/plans/2026-09-17-patient-journey-lab.md'
      - '.github/workflows/simulation-lab.yml'

jobs:
  foundation:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Dependencies
        run: dart pub get
        working-directory: packages/simulation_domain
      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test bin
        working-directory: packages/simulation_domain
      - name: Analyze
        run: dart analyze .
        working-directory: packages/simulation_domain
      - name: Test
        run: dart test
        working-directory: packages/simulation_domain
      - name: Foundation smoke
        run: dart run bin/foundation_smoke.dart --seed=20260914 > foundation-smoke.json
        working-directory: packages/simulation_domain
      - name: Replay failure smoke
        run: dart run bin/replay_failure.dart test/fixtures/missing_failure.json > replay-evidence.json
        working-directory: packages/simulation_domain
      - name: Persona smoke
        run: dart run bin/persona_smoke.dart --seed=20260915 > persona-fixtures.json
        working-directory: packages/simulation_domain
      - name: Cohort smoke
        run: dart run bin/cohort_smoke.dart --seed=20260915 > cohort-evidence.json
        working-directory: packages/simulation_domain
      - name: Synthetic health world smoke
        run: dart run bin/health_world_smoke.dart --seed=20260915 > health-world-evidence.json
        working-directory: packages/simulation_domain
      - name: Longitudinal simulation smoke
        run: dart run bin/longitudinal_smoke.dart --seed=20260915 > longitudinal-evidence.json
        working-directory: packages/simulation_domain
      - name: Ground-truth oracle smoke
        run: dart run bin/oracle_smoke.dart --seed=20260916 > oracle-evidence.json
        working-directory: packages/simulation_domain
      - name: Hard safety smoke
        run: dart run bin/hard_safety_smoke.dart --seed=20260916 > hard-safety-evidence.json
        working-directory: packages/simulation_domain
      - name: Permission and information-flow smoke
        run: dart run bin/permission_flow_smoke.dart --seed=20260916 > permission-flow-evidence.json
        working-directory: packages/simulation_domain
      - name: Relationship behavior smoke
        run: dart run bin/relationship_behavior_smoke.dart --seed=20260916 > relationship-behavior-evidence.json
        working-directory: packages/simulation_domain
      - name: Privacy attack smoke
        run: dart run bin/privacy_attack_smoke.dart --seed=20260916 > privacy-attack-evidence.json
        working-directory: packages/simulation_domain
      - name: Upload smoke report
        uses: actions/upload-artifact@v4
        with:
          name: simulation-foundation-smoke
          path: packages/simulation_domain/foundation-smoke.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload replay evidence
        uses: actions/upload-artifact@v4
        with:
          name: simulation-replay-evidence
          path: packages/simulation_domain/replay-evidence.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload persona fixtures
        uses: actions/upload-artifact@v4
        with:
          name: simulation-persona-fixtures
          path: packages/simulation_domain/persona-fixtures.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload cohort evidence
        uses: actions/upload-artifact@v4
        with:
          name: simulation-cohort-evidence
          path: packages/simulation_domain/cohort-evidence.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload synthetic health world evidence
        uses: actions/upload-artifact@v4
        with:
          name: simulation-health-world-evidence
          path: packages/simulation_domain/health-world-evidence.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload longitudinal simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: simulation-longitudinal-evidence
          path: packages/simulation_domain/longitudinal-evidence.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload ground-truth oracle evidence
        uses: actions/upload-artifact@v4
        with:
          name: simulation-oracle-evidence
          path: packages/simulation_domain/oracle-evidence.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload hard safety evidence
        uses: actions/upload-artifact@v4
        with:
          name: simulation-hard-safety-evidence
          path: packages/simulation_domain/hard-safety-evidence.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload permission and information-flow evidence
        uses: actions/upload-artifact@v4
        with:
          name: simulation-permission-flow-evidence
          path: packages/simulation_domain/permission-flow-evidence.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload relationship behavior evidence
        uses: actions/upload-artifact@v4
        with:
          name: simulation-relationship-behavior-evidence
          path: packages/simulation_domain/relationship-behavior-evidence.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload privacy attack evidence
        uses: actions/upload-artifact@v4
        with:
          name: simulation-privacy-attack-evidence
          path: packages/simulation_domain/privacy-attack-evidence.json
          if-no-files-found: error
          retention-days: 7

  patient-journey:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Patient dependencies
        run: flutter pub get
        working-directory: apps/patient
      - name: Patient journey format check
        run: dart format --output=none --set-exit-if-changed lib test
        working-directory: apps/patient
      - name: Analyze Patient
        run: flutter analyze
        working-directory: apps/patient
      - name: Patient journey smoke
        run: flutter test test/patient_journey_smoke_test.dart
        working-directory: apps/patient
      - name: Patient journey regressions
        run: >-
          flutter test
          test/patient_usability_test.dart
          test/quick_log_test.dart
          test/cycle_timeline_test.dart
          test/month_calendar_test.dart
          test/connected_health_screen_test.dart
          test/connected_health_view_model_builder_test.dart
          test/patient_home_connected_health_test.dart
          test/patient_home_clock_test.dart
        working-directory: apps/patient
      - name: Upload Patient journey evidence
        uses: actions/upload-artifact@v4
        with:
          name: simulation-patient-journey-evidence
          path: apps/patient/patient-journey-evidence.json
          if-no-files-found: error
          retention-days: 7
